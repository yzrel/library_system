spring:
  application:
    name: vfgnhs-library
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/library;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/{vendor}
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
library:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt-secret: ${JWT_SECRET:change-this-development-secret-key-before-production-123456}
  jwt-hours: ${JWT_HOURS:24}
  seed-admin:
    email: ${ADMIN_EMAIL:admin}
    password: ${ADMIN_PASSWORD:admin12354}
